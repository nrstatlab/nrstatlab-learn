[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"
markers = ["browser: drives Chromium against a live server (run last; they flush the database)"]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["content", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*"]
