name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nrstatlab
          POSTGRES_USER: nrstatlab
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nrstatlab" --health-interval 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgres://nrstatlab:ci-only@localhost:5432/nrstatlab
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Install Chromium for the browser tests
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check .
      - name: Django checks
        run: |
          python manage.py check
          DJANGO_SETTINGS_MODULE=config.settings.prod EMAIL_URL=smtp+tls://ci:ci-only@localhost:587 \
            python manage.py check --deploy
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: The content and its question bank import cleanly (dry run)
        run: |
          python manage.py import_site --dry-run
          python manage.py import_questions --dry-run
      - name: Tests (pages, redirects, site files, boundaries, accounts, progress, question bank, unit tests, browser)
        run: pytest --cov --cov-report=term-missing:skip-covered
      - name: Coverage of the scoring and progress apps is 90% or more (BUILD-GUIDE Step 15)
        run: coverage report --include="apps/assessments/*,apps/progress/*" --fail-under=90
      - name: No known vulnerabilities in the runtime dependencies
        run: pip-audit -r requirements.txt
